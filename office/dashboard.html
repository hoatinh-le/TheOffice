<title>Control Room</title>

<style>
  :root{
    --bg:#FFFFFF; --bg-inset:#FAFAFA;
    --ink:#1C1C1F; --ink-soft:#6B6F76; --ink-faint:#9499A1;
    --line:#ECECEE; --line-strong:#DEDEE2;
    --accent:#5E6AD2; --accent-hover:#4E59C4; --accent-soft:#EEF0FD;
    --good:#2F9E6E; --good-soft:#EAF7F0;
    --warn:#BD8215; --warn-soft:#FBF3E2;
    --critical:#C4433A; --critical-soft:#FCEBE9;
    --radius-sm:6px; --radius:8px;
    --font:"Inter",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  /* Deliberately light-only, no shadows, no large radii -- function over decoration. */
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:13.5px; line-height:1.45; -webkit-font-smoothing:antialiased;}
  .page{max-width:880px; margin:0 auto; padding:28px 24px 90px;}

  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px;}
  .brand svg{width:16px; height:16px; color:var(--accent);}
  .asof{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}

  .loading-note{font-family:var(--font-mono); font-size:11.5px; color:var(--warn); margin-bottom:14px; display:none; background:var(--warn-soft); padding:6px 10px; border-radius:var(--radius-sm);}
  .loading-note.show{display:block;}

  section{margin-bottom:28px;}
  .section-label{font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; padding:0 2px;}

  /* ---------- Office groups ---------- */
  .office-group{border-top:1px solid var(--line);}
  .office-group:last-child{border-bottom:1px solid var(--line);}
  .office-header{display:flex; align-items:baseline; gap:8px; padding:9px 2px 5px; flex-wrap:wrap;}
  .office-header svg{width:14px; height:14px; color:var(--ink-soft); flex-shrink:0; margin-top:1px;}
  .office-name{font-weight:600; font-size:13px;}
  .office-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex:1; min-width:120px;}
  .office-count{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}

  .task-row{display:flex; align-items:center; gap:9px; padding:6px 2px 6px 22px; border-top:1px solid var(--bg-inset);}
  .task-row:hover{background:var(--bg-inset);}
  .status-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; border:1.4px solid var(--ink-faint); background:transparent;}
  .status-dot.active{background:var(--accent); border-color:var(--accent);}
  .status-dot.done{background:var(--good); border-color:var(--good);}
  .status-dot.blocked{background:var(--critical); border-color:var(--critical);}
  .status-dot.needs-approval{background:var(--warn); border-color:var(--warn);}
  .task-row .title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
  .task-row .trailing{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex-shrink:0;}
  .task-row .chain-tag{color:var(--accent);}
  .task-row .status-word{text-transform:lowercase;}

  .empty-row{padding:6px 2px 10px 22px; font-size:12px; color:var(--ink-faint);}

  /* ---------- Approvals ---------- */
  .approval-row{display:flex; gap:12px; align-items:center; border-top:1px solid var(--line); padding:10px 2px;}
  .approval-row:last-child{border-bottom:1px solid var(--line);}
  .approval-row .info{flex:1; min-width:0;}
  .approval-row .action{font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .approval-row .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .approval-row .btns{display:flex; gap:6px; flex-shrink:0;}
  button{font-family:var(--font); font-size:12px; font-weight:500; border-radius:var(--radius-sm); padding:5px 12px; cursor:pointer; min-height:28px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink);}
  button:hover{background:var(--bg-inset);}
  button.approve{color:var(--good); border-color:var(--good-soft);}
  button.approve:hover{background:var(--good-soft);}
  button.reject{color:var(--critical); border-color:var(--critical-soft);}
  button.reject:hover{background:var(--critical-soft);}
  button:disabled{opacity:.4; cursor:default;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .empty{color:var(--ink-faint); font-size:12px; padding:8px 2px;}

  /* ---------- Handoffs ---------- */
  .handoff-row{display:flex; gap:10px; align-items:baseline; border-top:1px solid var(--line); padding:7px 2px; font-size:12.5px;}
  .handoff-row:last-child{border-bottom:1px solid var(--line);}
  .handoff-row .chain{font-family:var(--font-mono); font-size:11px; color:var(--accent); white-space:nowrap;}
  .handoff-row .summary{flex:1; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .handoff-row .at{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}

  .unavailable{padding:80px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="page">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Control Room
    </div>
    <span class="asof" id="asof"></span>
  </header>
  <div class="loading-note" id="loading-note">Still loading — data may be out of date.</div>

  <section>
    <div class="section-label">Needs your approval</div>
    <div id="approvals"></div>
  </section>

  <section>
    <div class="section-label">Offices</div>
    <div id="offices"></div>
  </section>

  <section>
    <div class="section-label">Recent handoffs</div>
    <div id="handoffs"></div>
  </section>
</div>

<script>
function setText(el, text) { el.textContent = text; }

// Static reference: what each office is actually wired to, as of this build.
// Kept separate from live task data on purpose -- this is configuration, not state.
const OFFICES = [
  { id:"engineering", name:"Engineering", icon:'<path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z"/><path d="M12 2v2.6M12 19.4V22M4 4l1.8 1.8M18.2 18.2 20 20M2 12h2.6M19.4 12H22M4 20l1.8-1.8M18.2 5.8 20 4"/>',
    meta:"pm · researcher · ecc-architect · ecc-tdd-guide · codex:codex-rescue" },
  { id:"product", name:"Product", icon:'<path d="M7 2.5h7l3 3V21a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 7 21V3a.5.5 0 0 1 .5-.5Z"/><path d="M14 2.5V6h3.5"/>',
    meta:"pm · researcher · ecc-planner · Linear ●" },
  { id:"quality", name:"Quality", icon:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.6 2.6L16.2 9"/>',
    meta:"qa · release-manager · ecc-security-reviewer" },
  { id:"research", name:"Research", icon:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5 15.3 15.3"/>',
    meta:"researcher · last30days · Context7 ●  ·  Mobbin ○" },
  { id:"design", name:"Design", icon:'<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/>',
    meta:"designer · impeccable-* · Figma ○  ·  Mobbin ○" },
  { id:"data", name:"Data", icon:'<path d="M4 20V10M11 20V4M18 20v-7"/>',
    meta:"data-analyst · PostHog ○" },
  { id:"learning", name:"Learning", icon:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H12v18H5.5A1.5 1.5 0 0 1 4 19.5v-15Z"/><path d="M20 4.5A1.5 1.5 0 0 0 18.5 3H12v18h6.5a1.5 1.5 0 0 0 1.5-1.5v-15Z"/>',
    meta:"researcher (fallback only)" },
];

let currentTasks = [];

function renderOffices() {
  const el = document.getElementById("offices");
  el.innerHTML = "";
  for (const office of OFFICES) {
    const tasks = currentTasks.filter(t => t.office === office.id);

    const group = document.createElement("div");
    group.className = "office-group";

    const header = document.createElement("div");
    header.className = "office-header";
    const iconWrap = document.createElement("div");
    iconWrap.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${office.icon}</svg>`;
    const name = document.createElement("span");
    name.className = "office-name";
    setText(name, office.name);
    const meta = document.createElement("span");
    meta.className = "office-meta";
    setText(meta, office.meta);
    const count = document.createElement("span");
    count.className = "office-count";
    setText(count, tasks.length ? `${tasks.length} active` : "");
    header.append(iconWrap.firstChild, name, meta, count);
    group.appendChild(header);

    if (tasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-row";
      setText(empty, "No tasks right now.");
      group.appendChild(empty);
    } else {
      for (const t of tasks) {
        const row = document.createElement("div");
        row.className = "task-row";
        const dot = document.createElement("span");
        dot.className = "status-dot " + (t.status || "queued");
        const title = document.createElement("span");
        title.className = "title";
        setText(title, t.title || t.id);
        const trailing = document.createElement("span");
        trailing.className = "trailing";
        if (t.chain_id) {
          const tag = document.createElement("span");
          tag.className = "chain-tag";
          setText(tag, t.chain_id);
          trailing.appendChild(tag);
        }
        const status = document.createElement("span");
        status.className = "status-word";
        setText(status, t.status || "?");
        trailing.appendChild(status);
        row.append(dot, title, trailing);
        group.appendChild(row);
      }
    }
    el.appendChild(group);
  }
}

function renderHandoffs(handoffs) {
  const el = document.getElementById("handoffs");
  el.innerHTML = "";
  if (handoffs.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    setText(empty, "No handoffs yet.");
    el.appendChild(empty);
    return;
  }
  for (const h of handoffs) {
    const row = document.createElement("div");
    row.className = "handoff-row";
    const chain = document.createElement("span");
    chain.className = "chain";
    setText(chain, `${h.from || "?"} → ${h.to || "?"}`);
    const summary = document.createElement("span");
    summary.className = "summary";
    setText(summary, h.summary || "");
    const at = document.createElement("span");
    at.className = "at";
    setText(at, h.at || "");
    row.append(chain, summary, at);
    el.appendChild(row);
  }
}

function renderApprovals(db, approvals) {
  const el = document.getElementById("approvals");
  el.innerHTML = "";
  if (approvals.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    setText(empty, "Nothing pending.");
    el.appendChild(empty);
    return;
  }
  for (const a of approvals) {
    const row = document.createElement("div");
    row.className = "approval-row";
    const info = document.createElement("div");
    info.className = "info";
    const action = document.createElement("div");
    action.className = "action";
    setText(action, a.action || "");
    const meta = document.createElement("div");
    meta.className = "meta";
    setText(meta, `${a.task_id || "?"} · requested by ${a.requested_by || "?"}`);
    info.append(action, meta);

    const btns = document.createElement("div");
    btns.className = "btns";
    const approveBtn = document.createElement("button");
    approveBtn.className = "approve";
    setText(approveBtn, "Approve");
    const rejectBtn = document.createElement("button");
    rejectBtn.className = "reject";
    setText(rejectBtn, "Reject");

    const resolve = async (status) => {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      try {
        await db.doc("approvals/" + a.task_id).update({ status, resolved_at: new Date().toISOString() });
      } catch (e) {
        approveBtn.disabled = false;
        rejectBtn.disabled = false;
        action.textContent = (a.action || "") + "  [write failed — try again]";
      }
    };
    approveBtn.addEventListener("click", () => resolve("approved"));
    rejectBtn.addEventListener("click", () => resolve("rejected"));
    btns.append(approveBtn, rejectBtn);
    row.append(info, btns);
    el.appendChild(row);
  }
}

async function main() {
  document.getElementById("asof").textContent = new Date().toLocaleString();
  renderOffices();

  const db = await claude.use("db");
  if (!db) {
    document.querySelector(".page").innerHTML = '<div class="unavailable">Dashboard unavailable in this view.</div>';
    return;
  }

  const loadingNote = document.getElementById("loading-note");
  const timers = {};
  function armTimer(key) { timers[key] = setTimeout(() => loadingNote.classList.add("show"), 10000); }
  function clearTimer(key) {
    if (timers[key]) { clearTimeout(timers[key]); timers[key] = null; }
    if (Object.values(timers).every(t => !t)) loadingNote.classList.remove("show");
  }

  armTimer("tasks");
  db.collection("tasks").onSnapshot(
    (snap) => { clearTimer("tasks"); currentTasks = snap.docs.map(d => d.data()); renderOffices(); },
    () => { clearTimer("tasks"); }
  );

  armTimer("handoffs");
  db.collection("handoffs").orderBy("at", "desc").limit(20).onSnapshot(
    (snap) => { clearTimer("handoffs"); renderHandoffs(snap.docs.map(d => d.data())); },
    () => { clearTimer("handoffs"); }
  );

  armTimer("approvals");
  db.collection("approvals").where("status", "==", "pending").onSnapshot(
    (snap) => { clearTimer("approvals"); renderApprovals(db, snap.docs.map(d => d.data())); },
    () => { clearTimer("approvals"); }
  );
}

main();
</script>
